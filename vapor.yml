id: 46698
name: fires
environments:
    production:
        memory: 1024
        cli-memory: 512
        runtime: 'php-8.2:al2'
        scheduler: true
        queue-concurrency: 50
        storage: wildatheart-campfires
        cache: wildatheart-campfires
        database: wildatheart-campfires
        build:
          - 'COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev'
          - 'npm ci && npm run build && rm -rf node_modules'
        deploy:
            - 'php artisan migrate:fresh --seed'
