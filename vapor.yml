id: 46698
name: fires
environments:
  dev:
    memory: 1024
    cli-memory: 512
    runtime: docker
    storage: wildatheart-campfires-dev
    cache: wildatheart-campfires-dev
    database: wildatheart-campfires-dev
    build:
      - "COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev"
      - "php artisan event:cache"
      - "npm ci && npm run build && rm -rf node_modules"
    deploy:
      - "php artisan db:wipe --force"
      - "php artisan migrate --force"
      - "php artisan db:seed --class=RoleSeeder --force"
      - "php artisan db:seed --class=StateSeeder --force"
      - "php artisan db:seed --class=EventTypeSeeder --force"
      - "php artisan db:seed --class=EventSeeder --force"
      - "php artisan db:seed --class=EmailTemplateSeeder --force"
#      - "php artisan app:import-from-drupal"
#      - 'php artisan scout:flush "App\Models\Event"'
#      - 'php artisan scout:import "App\Models\Event"'
  prod:
    domain: local.wildatheart.org
    memory: 1024
    cli-memory: 512
    runtime: docker
    storage: wildatheart-campfires
    cache: wildatheart-campfires
    database: wildatheart-campfires
    build:
      - "COMPOSER_MIRROR_PATH_REPOS=1 composer install --no-dev"
      - "php artisan event:cache"
      - "npm ci && npm run build && rm -rf node_modules"
    deploy:
      - "php artisan migrate --force"
