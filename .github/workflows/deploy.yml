name: Deploy

on:
  push:
    branches: [ prod, dev ]

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: ${{ (github.ref_name == 'prod') && 'production' || 'development' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2
          coverage: none

      - name: Require Vapor CLI
        run: composer global require laravel/vapor-cli

      - name: Install Project Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        env:
          COMPOSER_AUTH: '{ "github-oauth": { "github.com": "${{ secrets.PAT }}" }, "http-basic": { "wire-elements-pro.composer.sh": { "username": "nic@wildatheart.org", "password": "${{ secrets.WIRE_ELEMENTS_PRO_KEY }}" }, "nova.laravel.com": { "username": "tech@wildatheart.org", "password": "${{ secrets.NOVA_KEY }}"}}}'

      - name: Deploy Environment
        run: vapor deploy ${{ github.ref_name }} --commit="${{ github.event.head_commit.id }}" --message="${{ github.event.head_commit.message }}"
        env:
          VAPOR_API_TOKEN: ${{ secrets.VAPOR_API_TOKEN }}
          VITE_REACT_APP_MAPBOX_TOKEN: ${{ secrets.VITE_REACT_APP_MAPBOX_TOKEN }}
          VITE_REACT_APP_ALGOLIA_API_KEY: ${{ secrets.VITE_REACT_APP_ALGOLIA_API_KEY }}
          VITE_REACT_APP_ALGOLIA_APP_ID: ${{ secrets.VITE_REACT_APP_ALGOLIA_APP_ID }}
          VITE_SCOUT_PREFIX: ${{ secrets.VITE_SCOUT_PREFIX }}
          VITE_BUNNY_CDN_URL: ${{ secrets.VITE_BUNNY_CDN_URL }}
