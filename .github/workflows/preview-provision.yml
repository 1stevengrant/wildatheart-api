name: preview-provision
on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]
jobs:
  harbor-provision:
    if: |
      github.event.pull_request.draft == false &&
      (
          (
              contains(github.event.pull_request.title, '[wah]') &&
              contains(fromJson('["opened", "reopened", "synchronize", "ready_for_review"]'), github.event.action)
          ) ||
          (
              github.event.action == 'edited' &&
              contains(github.event.pull_request.title, '[wah]') &&
              github.event.changes.title.from &&
              !contains(github.event.changes.title.from, '[wah]')
          )
      )
    runs-on: ubuntu-latest
    container:
      image: kirschbaumdevelopment/laravel-test-runner:8.1
    steps:
      - name: Install Harbor via Composer
        run: composer global require mehrancodes/laravel-harbor -q
      - name: Start Provisioning
        env:
          FORGE_DEPLOY_SCRIPT: "cd $FORGE_SITE_PATH; git pull origin $FORGE_SITE_BRANCH; composer install; php artisan migrate --force && php artisan db:seed --force && npm install && npm run build && rm -rf node_modules "
          FORGE_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_SERVER: ${{ secrets.FORGE_SERVER_ID }}
          FORGE_GIT_REPOSITORY: ${{ github.repository }}
          FORGE_GIT_BRANCH: ${{ github.head_ref }}
          FORGE_DOMAIN: local-staging.wildatheart.org
          FORGE_SSL_REQUIRED: true
          FORGE_SSL_ENABLED: true
          FORGE_DB_CREATION_REQUIRED: true
          FORGE_WAIT_ON_SSL: true
          FORGE_WAIT_ON_DEPLOY: true
          SUBDOMAIN_NAME: pr-${{ github.event.number }}
          FORGE_ENVIRONMENT_URL: https://pr-${{ github.event.number }}.local-staging.wildatheart.org
          GIT_COMMENT_ENABLED: true
          GIT_TOKEN: ${{ github.token }} # Required to post a comment on the pull request
          GIT_ISSUE_NUMBER: ${{ github.event.number }} # Required to post a comment on the pull request
        run: harbor provision
