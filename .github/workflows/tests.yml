name: Tests

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  tests:
    name: "Pest"
    runs-on: ubuntu-latest-m
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wahlocal_test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, mysql, xml, curl
          coverage: none

      - name: Copy environment file
        run: cp .env.testing.example .env

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          php artisan key:generate --no-interaction
          php artisan config:clear

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate TypeScript types
        run: |
          php artisan statamic:generate-types --skip-pint
          php artisan typescript:transform

      - name: Type check
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Build assets
        run: npm run build
        env:
          VITE_REACT_APP_MAPBOX_TOKEN: pk.ci-placeholder

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

      - name: Create parity database
        run: mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS wahlocal_parity;"

      - name: Install mydumper for production sync
        run: |
          curl -fsSL -o /tmp/mydumper.deb "https://github.com/mydumper/mydumper/releases/download/v1.0.11-1/mydumper_1.0.11-1.$(lsb_release -cs)_amd64.deb"
          sudo apt-get install -y /tmp/mydumper.deb
          mydumper --version

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wahlocal_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run tests
        run: ./vendor/bin/pest --parallel --profile
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wahlocal_test
          DB_DATABASE_PARITY: wahlocal_parity
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run browser smoke tests
        run: ./vendor/bin/pest tests/Browser/Smoke
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wahlocal_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Run parity tests
        run: ./vendor/bin/pest tests/Parity --group=production-parity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wahlocal_test
          DB_DATABASE_PARITY: wahlocal_parity
          DB_USERNAME: root
          DB_PASSWORD: password
          REMOTE_DATABASE_HOST: ${{ secrets.REMOTE_DATABASE_HOST }}
          REMOTE_DATABASE_USERNAME: ${{ secrets.REMOTE_DATABASE_USERNAME }}
          REMOTE_DATABASE_NAME: ${{ secrets.REMOTE_DATABASE_NAME }}
          REMOTE_DATABASE_PASSWORD: ${{ secrets.REMOTE_DATABASE_PASSWORD }}
          REMOTE_DATABASE_EXCLUDE_DATA: activity_log,failed_jobs,issues
          REMOTE_DATABASE_SSL_MODE: VERIFY_IDENTITY
          REMOTE_DATABASE_SSL_CA: /etc/ssl/certs/ca-certificates.crt

      - name: Cleanup test databases
        if: always()
        run: test -f vendor/autoload.php && php artisan test:cleanup-databases --force || true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wahlocal_test
          DB_USERNAME: root
          DB_PASSWORD: password

  deploy:
    name: "Deploy to Laravel Cloud"
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUD_ENVIRONMENT_ID: env-a30928a3-7914-470a-9299-fa68ac370a51
      LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}

    steps:
      - name: Trigger the deploy hook for this commit
        run: curl -fsS -X POST "${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}?commit_hash=${{ github.sha }}"

      - name: Setup PHP for the Laravel Cloud CLI
        if: env.LARAVEL_CLOUD_TOKEN != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Wait for the deployment of this commit to finish
        if: env.LARAVEL_CLOUD_TOKEN != ''
        run: |
          composer global require laravel/cloud-cli --no-interaction --quiet
          CLOUD="$(composer global config bin-dir --absolute)/cloud"

          for attempt in $(seq 1 180); do
            STATUS=$("$CLOUD" deployment:list "$CLOUD_ENVIRONMENT_ID" --json -n \
              | jq -r --arg sha "${{ github.sha }}" 'map(select(.commitHash == $sha)) | .[0].status // "not-started"')

            echo "Deployment status: $STATUS (check $attempt)"

            case "$STATUS" in
              deployment.succeeded) exit 0 ;;
              *fail*|*cancel*) echo "::error::Laravel Cloud deployment of ${{ github.sha }} ended with $STATUS"; exit 1 ;;
            esac

            sleep 10
          done

          echo "::error::Timed out waiting for the Laravel Cloud deployment of ${{ github.sha }}"
          exit 1
