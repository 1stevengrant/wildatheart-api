name: Extract Laravel ENV Keys (DELETE AFTER USE)
on:
  workflow_dispatch: # Manual trigger only for security

jobs:
  extract-secrets:
    name: Extract Secrets to S3
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change to your region

    - name: Extract LARAVEL_ENV_KEYS to file
      env:
        LARAVEL_ENV_KEYS: ${{ secrets.LARAVEL_ENV_KEYS }}
      run: |
        echo "=== LARAVEL_ENV_KEYS ===" > laravel-env-keys.txt
        echo "$LARAVEL_ENV_KEYS" >> laravel-env-keys.txt
        echo "" >> laravel-env-keys.txt
        echo "Generated at: $(date -u)" >> laravel-env-keys.txt

    - name: Upload to S3
      run: |
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        FILENAME="laravel-env-keys-${TIMESTAMP}.txt"
        aws s3 cp laravel-env-keys.txt "s3://wildatheart-campfires/secrets/${FILENAME}"
        echo "✅ Uploaded to: s3://wildatheart-campfires/secrets/${FILENAME}"
        echo "⚠️  REMEMBER TO DELETE THIS FILE AFTER VIEWING"

    - name: Clean up local file
      run: |
        shred -vfz -n 3 laravel-env-keys.txt || rm -f laravel-env-keys.txt
