title: Blocks
fields:
  - handle: blocks
    field:
      remove_empty_nodes: false
      type: bard
      display: Blocks
      buttons:
        - bts_styles
        - color
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - quote
        - anchor
        - image
        - table
        - prose-lg
        - hero-1
        - hero-2
        - heading-1
        - body-large
        - body-base
        - body-small
        - body-xsmall
      bts_styles:
        - prose-lg
        - body-base
        - body-large
        - body-small
        - body-xsmall
        - heading-1
        - hero-1
        - hero-2
      collapse: true
      sets:
        hero:
          display: Hero
          sets:
            hero:
              display: Hero
              fields:
                - import: hero
            hero_slider:
              display: "Hero Slider"
              fields:
                - import: hero_slider
            media_slider:
              display: "Media Slider"
              fields:
                - import: media_slider
            countdown:
              display: Countdown
              fields:
                - import: countdown
            buttons:
              display: Buttons
              fields:
                - import: buttons
            hero_title:
              display: "Hero Title"
              fields:
                - handle: hero_title
                  field: hero.hero_title
            hero_logo:
              display: "Hero Logo"
              fields:
                - handle: hero_logo
                  field: hero.hero_logo
            subscribe_form:
              display: "Subscribe Form"
              fields:
                - import: subscribe_form
            add_to_calendar:
              display: "Add To Calendar"
              instructions: "Add a button that adds events to a user's calendar of choice"
              icon: calendar-date
              fields:
                - import: add_to_calendar_block
            header:
              display: Header
              icon: layout-header
              fields:
                - import: header_block
            container:
              display: Container
              icon: programming-module-box-cube
              fields:
                - import: container_block
            styled_text:
              display: "Styled Text (DEPRECATED)"
              icon: text-formatting-all-caps
              fields:
                - import: styled_text_block
            columns_block:
              display: "Columns Block"
              icon: layout-three-columns
              fields:
                - import: columns_block
            bento_block:
              display: "Bento Block"
              icon: layout-split-right
              fields:
                - import: bento_block
            divider_block:
              display: "Divider Block"
              icon: layout-table-row-insert
              fields:
                - import: divider_block
            video_block:
              display: "Video Block"
              icon: media-webcam-video
              fields:
                - import: video_block
            code_block:
              display: "Code Block"
              icon: programming-script-code-brackets
              fields:
                - import: code_block
            testimonials_block:
              display: "Testimonials Block"
              icon: text-formatting-quotation
              fields:
                - import: testimonials_block
            image_slider_block:
              display: "Image Slider Block"
              icon: media-image-picture-orientation
              fields:
                - import: image_slider_block
