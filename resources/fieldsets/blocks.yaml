title: Blocks
fields:
  -
    handle: blocks
    field:
      remove_empty_nodes: false
      type: bard
      display: Blocks
      sets:
        hero:
          display: Hero
          sets:
            hero:
              display: Hero
              fields:
                -
                  import: hero
            hero_slider:
              display: 'Hero Slider'
              fields:
                -
                  import: hero_slider
            media_slider:
              display: 'Media Slider'
              fields:
                -
                  import: media_slider
            countdown:
              display: Countdown
              fields:
                -
                  import: countdown
            buttons:
              display: Buttons
              fields:
                -
                  import: buttons
            hero_title:
              display: 'Hero Title'
              fields:
                -
                  handle: hero_title
                  field: hero.hero_title
            hero_logo:
              display: 'Hero Logo'
              fields:
                -
                  handle: hero_logo
                  field: hero.hero_logo
            subscribe_form:
              display: 'Subscribe Form'
              fields:
                -
                  import: subscribe_form
            header:
              display: Header
              icon: layout-header
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: subtitle
                  field:
                    type: text
                    display: Subtitle
                -
                  handle: image
                  field:
                    container: s3
                    type: assets
                    display: Image
            container:
              display: Container
              icon: programming-module-box-cube
              fields:
                -
                  handle: margins
                  field:
                    options:
                      -
                        key: none
                        value: null
                      -
                        key: page
                        value: null
                    default: page
                    type: select
                    display: Margins
                -
                  handle: apply_prose
                  field:
                    type: toggle
                    display: 'Apply Prose'
                    instructions: 'Apply @tailwindcss/typography prose styles.'
                    default: true
                -
                  handle: blocks
                  field:
                    buttons:
                      - h1
                      - h2
                      - h3
                      - h4
                      - h5
                      - h6
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - removeformat
                      - quote
                      - anchor
                      - image
                      - table
                      - horizontalrule
                    remove_empty_nodes: false
                    type: bard
                    display: Blocks
                    sets:
                      container_set_group:
                        display: 'Container Set Group'
                        sets:
                          mini_bio:
                            display: 'Mini Bio'
                            icon: user-avatar
                            fields:
                              -
                                handle: name
                                field:
                                  type: text
                                  display: Name
                              -
                                handle: image
                                field:
                                  container: s3
                                  type: assets
                                  display: Image
                              -
                                handle: blocks
                                field:
                                  remove_empty_nodes: false
                                  type: bard
                                  display: Blocks
