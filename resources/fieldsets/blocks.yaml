title: Blocks
fields:
  -
    handle: blocks
    field:
      remove_empty_nodes: false
      type: bard
      display: Blocks
      sets:
        hero:
          display: Hero
          sets:
            hero:
              display: Hero
              fields:
                -
                  import: hero
            hero_slider:
              display: 'Hero Slider'
              fields:
                -
                  import: hero_slider
            media_slider:
              display: 'Media Slider'
              fields:
                -
                  import: media_slider
            countdown:
              display: Countdown
              fields:
                -
                  import: countdown
            buttons:
              display: Buttons
              fields:
                -
                  import: buttons
            hero_title:
              display: 'Hero Title'
              fields:
                -
                  handle: hero_title
                  field: hero.hero_title
            hero_logo:
              display: 'Hero Logo'
              fields:
                -
                  handle: hero_logo
                  field: hero.hero_logo
            subscribe_form:
              display: 'Subscribe Form'
              fields:
                -
                  import: subscribe_form
            add_to_calendar:
              display: 'Add To Calendar'
              instructions: "Add a button that adds events to a user's calendar of choice"
              icon: calendar-date
              fields:
                -
                  import: add_to_calendar_block
            header:
              display: Header
              icon: layout-header
              fields:
                -
                  import: header_block
            container:
              display: Container
              icon: programming-module-box-cube
              fields:
                -
                  import: container_block
            styled_text:
              display: 'Styled Text'
              icon: text-formatting-all-caps
              fields:
                -
                  import: styled_text_block
            columns:
              display: Columns
              fields:
                -
                  import: columns_block
