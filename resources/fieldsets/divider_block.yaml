title: 'Divider Block'
fields:
  -
    handle: show_line
    field:
      default: true
      type: toggle
      display: 'Show Line'
      width: 50
      instructions: 'Display or hide horizontal rule.'
  -
    handle: width
    field:
      options:
        -
          key: full
          value: 'Full Width'
        -
          key: container
          value: 'Container Width'
        -
          key: screen-sm
          value: 'Small Screen'
        -
          key: screen-md
          value: 'Medium Screen'
        -
          key: screen-lg
          value: 'Large Screen'
        -
          key: screen-xl
          value: 'Extra-large Screen'
        -
          key: screen-2xl
          value: 'XXL Screen'
