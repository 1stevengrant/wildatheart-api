title: Button
fields:
  -
    handle: text
    field:
      type: text
      display: Text
  -
    handle: href
    field:
      type: link
      display: Link
  -
    handle: variant
    field:
      options:
        primary: Primary
        secondary: Secondary
        cta: 'Call to Action'
      default: primary
      type: select
      display: Variant
  -
    handle: size
    field:
      options:
        -
          key: large
          value: Large
        -
          key: medium
          value: Medium
        -
          key: small
          value: Small
      default: large
      type: select
      display: Size
  -
    handle: left_icon
    field:
      type: group
      display: 'Left Icon'
      fields:
        -
          import: icon
  -
    handle: right_icon
    field:
      type: group
      display: 'Right Icon'
      fields:
        -
          import: icon
  -
    handle: open_in_modal
    field:
      type: toggle
      display: 'Open In Modal'
      if:
        open_in_new_tab: 'equals false'
  -
    handle: open_in_new_tab
    field:
      type: toggle
      display: 'Open In New Tab'
      if:
        open_in_modal: 'equals false'
