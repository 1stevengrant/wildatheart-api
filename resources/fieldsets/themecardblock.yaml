title: 'Theme Card Block'
fields:
  -
    handle: featured_image
    field:
      max_files: 1
      container: s3
      type: assets
      display: 'Featured Image'
  -
    handle: leader
    field:
      type: text
      display: Leader
      instructions: 'Small text above title'
  -
    handle: title
    field:
      type: text
      display: Title
  -
    handle: description
    field:
      type: text
      display: Description
  -
    handle: button
    field:
      type: group
      display: Button
      fields:
        -
          import: button
  -
    handle: href
    field:
      type: link
      display: Link
  -
    handle: tags
    field:
      type: replicator
      display: Tags
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            tag:
              display: Tag
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
