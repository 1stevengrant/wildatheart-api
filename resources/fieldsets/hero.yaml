title: Hero
fields:
  -
    handle: leader_text
    field:
      type: text
      display: 'Leader Text'
  -
    handle: hero_title
    field:
      type: replicator
      display: 'Hero Title'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            text_line:
              display: 'Text Line'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
                -
                  handle: text_style
                  field:
                    options:
                      solid: Solid
                      hollow: Hollow
                    type: select
                    display: 'Text Style'
  -
    handle: hero_subtitle
    field:
      save_html: true
      antlers: true
      type: bard
      display: 'Hero Subtitle'
  -
    handle: background_video_url
    field:
      type: link
      display: 'Background Video Url'
  -
    handle: background_video_fallback_image
    field:
      max_files: 1
      container: s3
      type: assets
      display: 'Background Video Fallback Image'
      validate:
        - image
      if:
        background_video_url: 'not empty'
  -
    handle: featured_video_url
    field:
      type: link
      display: 'Featured Video Url'
  -
    handle: featured_video_fallback_image
    field:
      max_files: 1
      container: s3
      type: assets
      display: 'Featured Video Fallback Image'
      validate:
        - image
      if:
        featured_video_url: 'not empty'
  -
    handle: button_text
    field:
      type: text
      display: 'Button Text'
  -
    import: buttons
  -
    import: modal_button
