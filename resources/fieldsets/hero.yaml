title: Hero
fields:
  -
    handle: hero_1_text
    field:
      input_type: text
      antlers: false
      type: text
      display: 'Hero 1 Text'
      icon: text
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
  -
    handle: video_url
    field:
      input_type: url
      placeholder: 'https://player.vimeo.com'
      default: 'https://player.vimeo.com/external/503912510.hd.mp4?s=814f24119f83c7c5e1a6a50dc1cf165d3af3c327&profile_id=175'
      antlers: false
      type: text
      display: 'Video Url'
      icon: text
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
      validate:
        - sometimes
        - url
  -
    handle: video_fallback_image
    field:
      max_files: 1
      mode: list
      container: s3
      restrict: false
      allow_uploads: true
      show_filename: true
      show_set_alt: true
      type: assets
      display: 'Video Fallback Image'
      icon: assets
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
      validate:
        - image
      if:
        video_url: 'not empty'
  -
    handle: button_text
    field:
      input_type: text
      antlers: false
      type: text
      display: 'Button Text'
      icon: text
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
  -
    import: modal_button
