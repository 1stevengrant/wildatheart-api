title: "Container Block"
fields:
  - handle: blocks
    field:
      buttons:
        - bts_styles
        - color
        - h2
        - h3
        - h4
        - h5
        - h6
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - removeformat
        - horizontalrule
        - quote
        - anchor
        - image
        - table
        - prose-lg
        - hero-1
        - hero-2
        - heading-1
        - body-large
        - body-base
        - body-small
        - body-xsmall
      bts_styles:
        - prose-lg
        - body-base
        - body-large
        - body-small
        - body-xsmall
        - heading-1
        - hero-1
        - hero-2
      remove_empty_nodes: false
      type: bard
      display: Blocks
      container: s3
      sets:
        container_set_group:
          display: "Container Set Group"
          sets:
            mini_bio:
              display: "Mini Bio"
              fields:
                - import: mini_bio_block
            image:
              display: Image
              icon: media-image-picture-orientation
              fields:
                - import: image_block
            code_block:
              display: "Code Block"
              icon: programming-script-code-brackets
              fields:
                - import: code_block
            link_accordion_block:
              display: "Link Accordion Block"
              icon: navigation-menu
              fields:
                - import: link_accordion_block
