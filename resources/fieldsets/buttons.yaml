title: Buttons
fields:
  -
    handle: buttons
    field:
      type: replicator
      display: Buttons
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            new_set:
              display: 'New Set'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
                -
                  handle: link
                  field:
                    type: link
                    display: Link
                -
                  handle: variant
                  field:
                    options:
                      primary: Primary
                      secondary: Secondary
                      cta: 'Call to Action'
                    type: select
                    display: Variant
                -
                  handle: left_icon
                  field:
                    type: section
                    display: 'Left Icon'
                -
                  import: icon
                  prefix: button_left_
                -
                  handle: right_icon
                  field:
                    type: section
                    display: 'Right Icon'
                -
                  import: icon
                  prefix: button_right_
