title: Buttons
fields:
  -
    handle: buttons
    field:
      type: replicator
      display: Buttons
      max_sets: 2
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            button:
              display: Button
              fields:
                -
                  import: button
            add_to_calendar:
              display: 'Add to Calendar'
              icon: calendar-date
              fields:
                -
                  import: add_to_calendar_block
  -
    handle: position
    field:
      options:
        start: Align-left
        center: Align-center
        end: Align-right
      max_items: 1
      default: center
      type: select
      display: Alignment
