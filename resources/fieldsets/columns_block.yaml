title: 'Columns Block'
fields:
  -
    handle: columns
    field:
      type: replicator
      display: Columns
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            column:
              display: Column
              fields:
                -
                  handle: blocks
                  field:
                    type: replicator
                    display: Blocks
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          styled_text:
                            display: 'Styled Text'
                            fields:
                              -
                                import: styled_text_block
                          image:
                            display: Image
                            fields:
                              -
                                import: image_block
                -
                  handle: column_width
                  field:
                    type: width
                    display: 'Column Width Desktop'
                    options:
                      - '20'
                      - '25'
                      - '33'
                      - '40'
                      - '50'
                      - '60'
                      - '66'
                      - '75'
                      - '80'
                      - '100'
                    default: '100'
