tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: author
            field:
              collections:
                - authors
              type: entries
              display: Author
          -
            handle: description
            field:
              type: textarea
              display: Description
              instructions: 'Displays in Header and in previews of book in search.'
          -
            import: blocks
          -
            handle: buy_book_url
            field:
              type: link
              display: 'Buy Book URL'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: Book
