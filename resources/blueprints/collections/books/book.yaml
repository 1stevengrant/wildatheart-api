tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: subtitle
            field:
              type: text
              display: Subtitle
              instructions: 'A phrase that appears below the title.'
          -
            import: images
          -
            handle: authors
            field:
              collections:
                - authors
              type: entries
              display: Authors
          -
            handle: description
            field:
              type: textarea
              display: 'Quick Description'
              instructions: 'Displays in Header and in previews of book in search. Usually one paragraph or less.'
          -
            handle: detail_description
            field:
              type: markdown
              display: 'Detail Description'
              instructions: 'A detailed markdown description. Always displayed in combination with the Quick Description.'
          -
            handle: buy_book_url
            field:
              type: link
              display: 'Buy Book URL'
          -
            handle: topics
            field: content.topics
          -
            handle: publication_date
            field:
              type: date
              display: 'Publication Date'
          -
            import: blocks
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: trigger_astro_build_field
            field:
              type: trigger_astro_build
              display: 'Trigger Astro Build Field'
              hide_display: true
              instructions: 'This content type is static and needs to rebuild the Astro front end.'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
title: Book
