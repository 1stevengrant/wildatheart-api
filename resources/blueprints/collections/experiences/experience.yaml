title: Experience
tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            import: content
            config:
              title:
                required: true
          -
            import: testimonials
          -
            handle: subsplash_series_id
            field:
              type: text
              display: 'Subsplash Series ID'
          -
            handle: experience_logo
            field:
              container: s3
              folder: wp-app/uploads
              type: assets
              display: 'Experience Logo'
              max_files: 1
          -
            handle: host_a_group_link
            field:
              placeholder: 'https://local.wildatheart.org'
              default: 'https://local.wildatheart.org'
              type: text
              display: 'Host a group link'
          -
            handle: find_a_group_link
            field:
              placeholder: 'https://local.wildatheart.org'
              default: 'https://local.wildatheart.org'
              type: text
              display: 'Find a group link'
          -
            handle: related_event_type
            field:
              resource: event_type
              type: belongs_to
              display: 'Relates To Event'
              instructions: 'Choose the event type you want to load events from for the map.'
              mode: select
              create: false
      -
        display: Sessions
        fields:
          -
            handle: sessions
            field:
              collections:
                - media_item
              type: entries
              display: Sessions
      -
        display: SEO
        fields:
          -
            import: seo
  hero:
    display: Hero
    sections:
      -
        display: Hero
        fields:
          -
            import: hero
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: trigger_astro_build_field
            field:
              type: trigger_astro_build
              display: 'Trigger Astro Build Field'
              hide_display: true
              instructions: 'This content type is static and needs to rebuild the Astro front end.'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
