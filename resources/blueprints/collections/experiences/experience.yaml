title: Experience
tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            import: content
            config:
              title:
                required: true
  hero:
    display: Hero
    sections:
      -
        display: Hero
        fields:
          -
            import: hero
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
      -
        display: Images
        fields:
          -
            import: images
