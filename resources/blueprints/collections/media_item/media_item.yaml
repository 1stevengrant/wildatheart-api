tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: content
            config:
              title:
                required: true
          -
            handle: media_type
            field:
              options:
                audio: Audio
                video: Video
              type: select
              display: 'Media Type'
          -
            handle: audio_source_url
            field:
              input_type: url
              type: text
              display: 'Audio Source URL'
              validate:
                - sometimes
                - url
              if:
                media_type: 'equals audio'
          -
            handle: video_source_url
            field:
              input_type: url
              type: text
              display: 'Video Source URL'
              validate:
                - sometimes
                - url
              if:
                media_type: 'equals video'
          -
            handle: series
            field:
              collections:
                - media_series
              type: entries
              display: Series
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            import: images
title: 'Media Item'
