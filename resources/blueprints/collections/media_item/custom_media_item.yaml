title: 'Custom Media Item'
tabs:
  custom_layout:
    display: 'Custom Layout'
    sections:
      -
        display: 'New Section'
        fields:
          -
            import: blocks
      -
        display: SEO
        fields:
          -
            import: seo
  main:
    display: 'Media Item'
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: subsplash_media_item_id
            field:
              type: text
              display: 'Subsplash Media Item Id'
          -
            handle: series
            field:
              collections:
                - media_series
              type: link
              display: Series
          -
            handle: position
            field:
              type: integer
              display: Position
          -
            handle: media_type
            field:
              default: Session
              type: text
              display: 'Media Type'
              instructions: 'How you want this item to be labeled. (i.e. "Episode", "Session", etc.)'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
              time_enabled: true
          -
            handle: make_scheduled_page_public
            field:
              type: toggle
              display: 'Make Scheduled Page Public'
          -
            import: images
