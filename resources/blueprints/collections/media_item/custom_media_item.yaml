title: 'Custom Media Item'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            import: blocks
          -
            handle: subsplash_media_item_id
            field:
              type: text
              display: 'Subsplash Media Item Id'
          -
            handle: series
            field:
              collections:
                - media_series
              type: link
              display: Series
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            import: images
