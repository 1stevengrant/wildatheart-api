title: 'Subsplash Media Item'
tabs:
  main:
    display: Main
    sections:
      -
        display: 'Basic Info'
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: subtitle
            field:
              type: text
              display: Subtitle
              width: 50
          -
            handle: description
            field:
              type: bard
              display: Description
              remove_empty_nodes: false
      -
        display: Tags
        fields:
          -
            handle: speaker
            field:
              type: text
              display: Speaker
          -
            handle: topics
            field:
              type: terms
              taxonomies:
                - topics
              display: Topics
              mode: select
      -
        display: Video
        fields:
          -
            handle: video_iframe_url
            field:
              type: link
              display: 'Video IFrame URL'
              width: 50
          -
            handle: video_direct_url
            field:
              type: link
              display: 'Video Direct URL'
              width: 50
          -
            handle: vimeo_id
            field:
              type: text
              display: 'Vimeo ID'
              instructions: 'If a Vimeo ID is provided, it will override the Subsplash player.'
          -
            handle: is_vertical_video
            field:
              type: toggle
              display: 'Vertical Video?'
              instructions: 'Modifies layout slightly for vertical videos.'
      -
        display: Audio
        fields:
          -
            handle: audio_iframe_url
            field:
              type: link
              display: 'Audio IFrame URL'
              width: 50
          -
            handle: audio_direct_url
            field:
              type: link
              display: 'Audio Direct URL'
              width: 50
      -
        display: Document
        fields:
          -
            handle: document_title
            field:
              type: text
              display: 'Document Title'
          -
<<<<<<< Updated upstream
