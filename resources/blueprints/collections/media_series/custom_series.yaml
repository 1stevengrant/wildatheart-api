title: 'Custom Series'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            import: blocks
          -
            handle: media_items
            field:
              collections:
                - media_item
              type: entries
              display: 'Media Items'
          -
            handle: subsplash_media_series_id
            field:
              type: text
              display: 'Subsplash Media Series ID'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: hide_navigation
            field:
              type: toggle
              display: 'Hide Navigation'
          -
            handle: content_type
            field:
              type: terms
              taxonomies:
                - content_type
              display: 'Content Type'
              mode: select
          -
            handle: topics
            field:
              type: terms
              taxonomies:
                - topics
              display: Topics
              mode: select
