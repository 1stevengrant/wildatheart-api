title: Prayers
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              remove_empty_nodes: false
              type: bard
              display: Content
          -
            handle: pdf
            field:
              max_files: 1
              container: s3
              type: assets
              display: PDF
              folder: files/prayers
              dynamic: slug
              restrict: true
          -
            handle: mp3
            field:
              max_files: 1
              container: s3
              type: assets
              display: MP3
              folder: files/prayers
              dynamic: slug
              restrict: true
          -
            handle: drupal_url
            field:
              type: text
              display: 'Drupal URL'
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
