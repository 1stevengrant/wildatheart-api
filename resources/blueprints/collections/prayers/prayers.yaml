title: Prayers
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            import: blocks
            prefix: before_content_
          -
            handle: content
            field:
              remove_empty_nodes: false
              type: bard
              display: Content
          -
            import: blocks
            prefix: after_content_
          -
            handle: summary
            field:
              type: textarea
              display: Summary
          -
            handle: pdf
            field:
              max_files: 1
              container: s3
              type: assets
              display: PDF
              folder: files/prayers
              dynamic: slug
              restrict: true
          -
            handle: mp3
            field:
              max_files: 1
              container: s3
              type: assets
              display: MP3
              folder: files/prayers
              dynamic: slug
              restrict: true
          -
            handle: drupal_url
            field:
              type: text
              display: 'Drupal URL'
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: trigger_astro_build_field
            field:
              type: trigger_astro_build
              display: 'Trigger Astro Build Field'
              hide_display: true
              instructions: 'This content type is static and needs to rebuild the Astro front end.'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: parent
            field:
              type: entries
              collections:
                - prayers
              max_items: 1
              listable: false
              localizable: true
