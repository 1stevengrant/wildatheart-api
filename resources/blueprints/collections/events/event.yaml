tabs:
  main:
    display: Main
    sections:
      -
        display: Hero
        fields:
          -
            import: hero
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
          -
            handle: subtitle
            field:
              type: textarea
              display: Subtitle
          -
            handle: long_form_description
            field:
              type: bard
              display: 'Long-form Description'
          -
            handle: event_type
            field:
              options:
                retreats: 'Multi-Day Retreat'
                experiences: 'Video Study'
                fires: 'Local Gathering'
              type: select
              display: 'Event Type'
          -
            handle: topics
            field:
              taxonomies:
                - topics
              type: terms
              display: Topics
          -
            handle: featured_image
            field:
              container: s3
              type: assets
              display: 'Featured Image'
              folder: wp-app/uploads
          -
            handle: background_image
            field:
              container: s3
              folder: wp-app/uploads
              type: assets
              display: 'Background Image'
          -
            handle: event_logo
            field:
              container: s3
              folder: wp-app/uploads
              type: assets
              display: 'Event Logo'
          -
            handle: featured_video
            field:
              type: link
              display: 'Featured Video'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
title: event
