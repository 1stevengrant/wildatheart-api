title: 'Video Study'
tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            import: content
            config:
              title:
                required: true
          -
            handle: related_content
            field:
              type: entries
              display: 'Related Content'
              max_items: 1
      -
        display: SEO
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: trigger_astro_build_field
            field:
              type: trigger_astro_build
              display: 'Trigger Astro Build Field'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
