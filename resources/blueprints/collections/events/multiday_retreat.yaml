tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: content
            config:
              title:
                required: true
          -
            handle: event_type
            field:
              taxonomies:
                - event_types
              type: terms
              display: 'Event Type'
              max_items: 1
          -
            handle: is_local_event
            field:
              type: toggle
              display: 'Is this a Local Event?'
              instructions: 'This allows you to choose a logo for the event and displays the event stats in the sidebar.'
          -
            handle: event_logo
            field:
              container: s3
              folder: wp-app/uploads
              type: assets
              display: 'Event Logo'
              max_files: 1
              if:
                is_local_event: 'equals true'
          -
            handle: related_event_type
            field:
              resource: event_type
              type: belongs_to
              display: 'Relates To Event'
              instructions: 'Choose the event type you want to load events from for the map.'
              mode: select
              create: false
              if:
                is_local_event: 'equals true'
      -
        display: Testimonials
        fields:
          -
            import: testimonials
      -
        display: 'Video Testimonials'
        fields:
          -
            import: vertical_videos_block
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: trigger_astro_build_field
            field:
              type: trigger_astro_build
              display: 'Trigger Astro Build Field'
              hide_display: true
              instructions: 'This content type is static and needs to rebuild the Astro front end.'
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
      -
        display: Images
        fields:
          -
            import: images
  hero:
    display: Hero
    sections:
      -
        display: Hero
        fields:
          -
            import: hero
title: 'Multi-day Retreat'
