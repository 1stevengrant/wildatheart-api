tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: content
            config:
              title:
                required: true
          -
            handle: event_logo
            field:
              container: s3
              folder: wp-app/uploads
              type: assets
              display: 'Event Logo'
              max_files: 1
      -
        display: Testimonials
        fields:
          -
            import: testimonials
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
      -
        display: Images
        fields:
          -
            import: images
  hero:
    display: Hero
    sections:
      -
        display: Hero
        fields:
          -
            import: hero
title: 'Multi-day Retreat'
