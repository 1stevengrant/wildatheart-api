tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              remove_empty_nodes: true
              type: bard
              display: Content
              link_collections:
                - blogs
                - books
                - categories
                - authors
                - events
                - experiences
                - media_item
                - media_series
                - pages
                - podcasts
                - prayers
                - sessions
              container: s3
              smart_typography: true
              save_html: true
              word_count: true
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    new_set:
                      display: 'New Set'
                      fields: {  }
          -
            handle: author
            field:
              max_items: 1
              collections:
                - authors
              type: entries
              display: Author
          -
            handle: categories
            field:
              collections:
                - categories
              type: entries
              display: Categories
          -
            handle: main_image
            field:
              container: s3
              type: assets
              display: 'Main Image'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
title: Blog
