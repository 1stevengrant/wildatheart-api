tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Title
              instructions: 'Full name of the Contributor'
          -
            handle: image
            field:
              container: s3
              type: assets
              display: Image
              max_files: 1
              instructions: 'Picture of the Contributor'
          -
            handle: roles_description
            field:
              type: text
              display: 'Roles Description'
              instructions: 'A brief description of the roles and positions this person holds, e.g. "Author, Founder of Wild At Heart Ministries"'
          -
            handle: bio_short
            field:
              buttons:
                - bold
                - italic
                - link
              type: markdown
              display: 'Bio Short'
              instructions: 'short biography'
          -
            handle: bio_long
            field:
              type: markdown
              display: 'Bio Long'
              instructions: 'long biography'
          -
            handle: updates_explanation
            field:
              type: markdown
              display: 'Updates Explanation'
              instructions: 'A couple sentences explaining the ways to receive communication updates from this person.'
          -
            handle: updates_links
            field:
              type: grid
              display: 'Updates Links'
              instructions: 'Links for how to receive updates from this person.'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: link
                  field:
                    type: link
                    display: Link
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
title: Contributor
