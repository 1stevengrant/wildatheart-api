tabs:
  host:
    display: Host
    sections:
      -
        display: 'Host Agreement'
        instructions: 'The host agreement for Wild at Heart Events'
        fields:
          -
            handle: host_agreement_content
            field:
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - link
              type: markdown
              display: 'Host Agreement Content'
  featured_content:
    display: 'Featured Content'
    sections:
      -
        display: 'Featured Content'
        instructions: 'This will enable a featured item in the Local events platform'
        fields:
          -
            handle: featured_content_items
            field:
              type: replicator
              display: 'Featured Content Items'
              sets:
                featured_item_group:
                  display: 'Featured Item Group'
                  sets:
                    featured_item:
                      display: 'Featured Item'
                      icon: arrow-right
                      fields:
                        -
                          handle: item_text
                          field:
                            type: text
                            display: 'Item Text'
                        -
                          handle: item_url
                          field:
                            input_type: url
                            type: text
                            display: 'Item URL'
                        -
                          handle: item_image
                          field:
                            max_files: 1
                            min_files: 1
                            mode: grid
                            container: s3
                            type: assets
                            display: 'Item Image'
                            validate:
                              - required
                              - image
                        -
                          handle: show_in_regions
                          field:
                            options:
                              -
                                key: europe
                                value: europe
                              -
                                key: north_america
                                value: north_america
                              -
                                key: south_america
                                value: south_america
                              -
                                key: asia
                                value: asia
                              -
                                key: africa
                                value: africa
                              -
                                key: oceania
                                value: oceania
                            type: checkboxes
                            display: 'Show In Regions'
                        -
                          handle: relates_to
                          field:
                            resource: event
                            type: belongs_to
                            display: 'Relates To'
                            with:
                              - user
                              - eventType
                            relationship_name: Event
