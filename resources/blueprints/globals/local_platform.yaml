tabs:
  main:
    display: Main
    sections:
      -
        display: 'Host Agreement'
        instructions: 'The host agreement for Wild at Heart Events'
        fields:
          -
            handle: host_agreement
            field:
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - table
              remove_empty_nodes: true
              type: bard
              display: 'Host Agreement'
              validate:
                - required
              sets:
                '':
                  display: null
                  sets:
                    image:
                      display: Image
                      icon: media-image-picture-orientation
                      fields:
                        -
                          handle: image
                          field:
                            max_files: 1
                            container: app
                            type: assets
                            display: Image
                    video:
                      display: Video
                      icon: media-webcam-video
                      fields:
                        -
                          handle: video
                          field:
                            type: video
                            display: Video
