title: User
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: family_name
            field:
              type: text
              display: 'Family Name'
              width: 50
          -
            handle: given_name
            field:
              type: text
              display: 'Given Name'
              width: 50
          -
            handle: name
            field:
              type: text
              display: Name
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'Email Address'
              listable: true
              input: email
          -
            handle: roles
            field:
              type: user_roles
              mode: select
              width: 50
              listable: true
              filterable: false
          -
            handle: groups
            field:
              type: user_groups
              mode: select
              width: 50
              listable: true
              filterable: false
          -
            handle: avatar
            field:
              type: assets
              max_files: 1
              container: s3
          -
            handle: wegive_donor_id
            field:
              type: text
              display: 'WeGive Donor ID'
              visibility: read_only
          -
            handle: salesforce_contact_id
            field:
              type: text
              display: 'Salesforce Contact ID'
              visibility: read_only
          -
            handle: phone
            field:
              input_type: tel
              type: text
              display: Phone
