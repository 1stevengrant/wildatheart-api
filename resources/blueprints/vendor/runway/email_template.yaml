tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate: required
          -
            handle: is_active
            field:
              type: toggle
              display: 'Is Active'
          -
            handle: cc_co_hosts
            field:
              type: toggle
              display: 'CC Co-hosts'
              instructions: 'Send a copy of this email to the event co-hosts. Only applies to emails sent to event hosts.'
          -
            handle: from_name
            field:
              type: text
              display: 'From Name'
          -
            handle: from_email
            field:
              type: text
              display: 'From Email'
          -
            handle: subject
            field:
              type: text
              display: Subject
              validate: required
          -
            handle: notes
            field:
              type: textarea
              display: Notes
          -
            handle: body
            field:
              type: markdown
              display: Body
          -
            handle: last_updated_by
            field:
              resource: user
              relationship_name: lastUpdatedByUser
              type: belongs_to
              display: 'Last Updated By'
              title_format: '{family_name}, {given_name}'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              display: Slug
              validate: required
title: 'Email template'
