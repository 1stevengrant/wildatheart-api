tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: id
            field:
              type: text
              display: ID
              width: 50
              visibility: read_only
          -
            handle: name
            field:
              type: text
              display: Name
              width: 33
          -
            handle: event_type_id
            field:
              resource: event_type
              type: belongs_to
              display: 'Event Type'
              width: 33
          -
            handle: user_id
            field:
              resource: user
              type: belongs_to
              display: 'User ID'
              width: 33
          -
            handle: is_private
            field:
              type: toggle
              display: 'Is Private'
              width: 50
          -
            handle: phone
            field:
              input_type: tel
              type: text
              display: Phone
              width: 50
          -
            handle: street_address
            field:
              type: text
              display: 'Street Address'
              width: 25
          -
            handle: state
            field:
              type: text
              display: State
              width: 25
          -
            handle: city
            field:
              type: text
              display: City
              width: 25
          -
            handle: zip
            field:
              type: text
              display: ZIP
              width: 25
          -
            handle: longitude
            field:
              type: text
              display: Longitude
              width: 50
          -
            handle: latitude
            field:
              type: text
              display: Latitude
              width: 50
          -
            handle: region
            field:
              type: text
              display: Region
              width: 33
          -
            handle: district
            field:
              type: text
              display: District
              width: 33
          -
            handle: locality
            field:
              type: text
              display: Locality
              width: 33
          -
            handle: neighborhood
            field:
              type: text
              display: Neighborhood
              width: 50
          -
            handle: place
            field:
              type: text
              display: Place
              width: 50
          -
            handle: sex
            field:
              options:
                -
                  key: men
                  value: men
                -
                  key: women
                  value: women
              type: radio
              display: Sex
          -
            handle: start_date
            field:
              type: date
              display: 'Start Date'
              width: 50
          -
            handle: end_date
            field:
              type: date
              display: 'End Date'
              width: 50
              visibility: read_only
          -
            handle: description
            field:
              type: markdown
              display: Description
          -
            handle: summary
            field:
              type: markdown
              display: Summary
  meta:
    display: Meta
    sections:
      -
        fields:
          -
            handle: gift_sent
            field:
              type: toggle
              display: 'Gift Sent'
              width: 33
              visibility: read_only
          -
            handle: welcome_sent
            field:
              type: toggle
              display: 'Welcome Sent'
              visibility: read_only
              width: 33
          -
            handle: gift_requested
            field:
              type: toggle
              display: 'Gift Requested'
              width: 33
              visibility: read_only
          -
            handle: last_checkin_email_sent_at
            field:
              type: date
              display: 'Last Checkin Email Sent At'
              width: 50
          -
            handle: number_of_items_in_material_order
            field:
              input_type: number
              type: text
              display: 'Number Of Items In Material Order'
              width: 50
  featured_event:
    display: 'Featured Event'
    sections:
      -
        fields:
          -
            handle: is_featured
            field:
              type: toggle
              display: 'Is Featured'
              width: 50
              instructions: 'Toggle to mark this event as featured'
          -
            handle: always_show
            field:
              type: toggle
              display: 'Always Show'
              width: 50
              instructions: 'This event will always appear on the map regardless of viewport'
          -
            handle: custom_landing_url
            field:
              input_type: url
              type: text
              display: 'Custom Landing URL'
              validate:
                - active_url
                - nullable
              width: 50
              instructions: "Does this event have its own special landing page that isn't the standard Local event type template?"
title: Event
