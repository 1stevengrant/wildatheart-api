tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: is_active
            field:
              type: toggle
              display: 'Is Active'
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: key_details
            field:
              type: grid
              display: 'Key Details'
              instructions: 'This shows on the Event Type detail page'
              fields:
                -
                  handle: icon
                  field:
                    type: textarea
                    display: Icon
                -
                  handle: headline
                  field:
                    type: text
                    display: Headline
                -
                  handle: description
                  field:
                    type: text
                    display: Description
          -
            handle: description
            field:
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - link
              type: markdown
              display: Description
              instructions: 'The general description of the event, used by the Local Platform. Event pages on wildatheart.org use the Description on the V1 API tab.'
          -
            handle: card_teaser_text
            field:
              buttons:
                - bold
                - italic
              type: markdown
              display: 'Card Teaser Text'
              instructions: 'Used when someone choose to host this Event Type'
          -
            handle: tags
            field:
              type: text
              display: Tags
              instructions: 'A comma-separated list of tags, shown when someone chooses to host this Event Type'
          -
            handle: sex
            field:
              options:
                men: men
                women: women
              default: men
              type: radio
              display: Sex
          -
            handle: group_type
            field:
              options:
                -
                  key: fire
                  value: Fire
                -
                  key: experience
                  value: Experience
                -
                  key: retreat
                  value: Retreat
              type: radio
              display: 'Group Type'
              validate:
                - required
                - string
          -
            handle: type
            field:
              options:
                -
                  key: gathering
                  value: Gathering
                -
                  key: retreat
                  value: Retreat
                -
                  key: course
                  value: Course
              type: radio
              display: Type
          -
            handle: order
            field:
              input_type: number
              type: text
              display: Order
              instructions: 'This defines the order of the event type display 1 being first and the higher number being last'
              validate:
                - required
                - integer
          -
            handle: free_gift_image
            field:
              max_files: 1
              container: app
              type: assets
              display: 'Free Gift Image'
              instructions: 'Upload or choose the image for the free gift'
          -
            handle: related_landing_page_id
            field:
              max_items: 1
              collections:
                - events
              type: entries
              display: 'Related Landing Page'
              instructions: 'Select the Statamic Events entry used as the landing page for this event type. The API includes its content in event type and individual event responses, which allows clients to display the correct landing page.'
  media:
    display: Media
    sections:
      -
        fields:
          -
            handle: image
            field:
              max_files: 1
              container: app
              type: assets
              display: Image
              validate:
                - required
                - image
              instructions: 'This is the main image of the Event Type, used on content cards etc'
          -
            handle: hero_image
            field:
              max_files: 1
              container: app
              type: assets
              display: 'Hero Image'
              instructions: 'This is the image shown on the detail page for an Event Type in the local platform'
          -
            handle: hero_video
            field:
              type: video
              display: 'Hero Video'
              instructions: 'This is the hero video shown on the Event Type detail page on the Local Platform'
          -
            handle: photos
            field:
              container: app
              folder: event_types
              type: assets
              display: Photos
              instructions: 'These are generic photos from this kind of Event Type'
  registration:
    display: Registration
    sections:
      -
        instructions: 'The information that will appear when choosing to host this Event Type'
        fields:
          -
            handle: registration_welcome_video
            field:
              type: text
              display: 'Registration Welcome Video'
              validate:
                - nullable
                - url
              instructions: 'This video will appear on the welcome screen when choosing to host this Event Type'
          -
            handle: registration_welcome_text
            field:
              buttons:
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - link
              type: markdown
              display: 'Registration Welcome Text'
              instructions: 'This text will show on the welcome when choosing to host this Event Type'
          -
            handle: registration_before_your_event_text
            field:
              type: markdown
              display: 'Registration Before Your Event Text'
              instructions: 'This will show on the `Before your event` screen when choosing to host this Event Type'
          -
            handle: event_schedule
            field:
              type: replicator
              display: 'Event Schedule'
              instructions: 'This will show the schedule for this Event Type'
              sets:
                new_set_group:
                  display: 'New Set Group'
                  sets:
                    text:
                      display: Text
                      icon: text-formatting-all-caps
                      fields:
                        -
                          handle: text_block
                          field:
                            buttons:
                              - bold
                              - italic
                              - unorderedlist
                              - orderedlist
                              - quote
                            type: markdown
                            display: 'Text Block'
                    video:
                      display: Video
                      icon: media-webcam-video
                      fields:
                        -
                          handle: embed_code
                          field:
                            type: code
                            display: 'Embed Code'
                        -
                          handle: video_url
                          field:
                            type: video
                            display: 'Video URL'
          -
            handle: event_faqs
            field:
              type: grid
              display: 'Event FAQs'
              instructions: 'These are frequently asked questions about the Event Type'
              fields:
                -
                  handle: question
                  field:
                    type: text
                    display: Question
                    validate:
                      - required
                -
                  handle: answer
                  field:
                    buttons:
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                    type: markdown
                    display: Answer
                    validate:
                      - required
      -
        display: Overrides
        instructions: 'Use these to override event type defaults'
        fields:
          -
            handle: welcome_nav_text_override
            field:
              type: text
              display: 'Welcome Nav Text'
          -
            handle: before_event_nav_text_override
            field:
              type: text
              display: 'Before Event Nav Text'
          -
            handle: schedule_nav_text_override
            field:
              type: text
              display: 'Schedule Nav Text'
          -
            handle: faq_nav_text_override
            field:
              type: text
              display: 'FAQ Nav Text'
  resources:
    display: Resources
    sections:
      -
        fields:
          -
            handle: action_buttons
            field:
              type: grid
              display: 'Action Buttons'
              add_row: 'Add Button'
              fields:
                -
                  handle: button_label
                  field:
                    type: text
                    display: 'Button Label'
                -
                  handle: button_url
                  field:
                    type: text
                    display: 'Button URL'
                -
                  handle: button_entry
                  field:
                    max_items: 1
                    type: entries
                    display: 'Button Entry'
                -
                  handle: open_in_new_tab
                  field:
                    type: toggle
                    display: 'Open In New Tab?'
          -
            handle: video_link
            field:
              type: text
              display: 'Video Link'
              validate:
                - nullable
                - url
              instructions: 'A link to the video content for the Event Type'
          -
            handle: allow_materials_order
            field:
              type: toggle
              display: 'Allow Materials Order'
              instructions: 'Should this event type allow the a materials order?'
          -
            handle: number_of_items_in_material_order_label
            field:
              type: text
              display: 'Number of items in material order label'
              instructions: 'Allows the customization of the label eg. `Expected number of attendees`'
              validate:
                - required
                - string
          -
            handle: zapier_webhook_url
            field:
              input_type: url
              type: text
              display: 'Zapier Webhook URL'
              validate:
                - active_url
  event_guide:
    display: 'Event Guide'
    sections:
      -
        display: 'Event Guide Pages'
        fields:
          -
            handle: event_guide_pages
            field:
              type: replicator
              display: Pages
              sets:
                page_set:
                  display: 'Page Set'
                  sets:
                    page:
                      display: Page
                      icon: layout-page-break
                      fields:
                        -
                          handle: page_title
                          field:
                            type: text
                            display: 'Page Title'
                        -
                          handle: page_content
                          field:
                            type: replicator
                            display: 'Page Content'
                            sets:
                              new_set_group:
                                display: 'New Set Group'
                                sets:
                                  body_set:
                                    display: 'Body Set'
                                    icon: text-formatting-paragraph
                                    fields:
                                      -
                                        handle: body
                                        field:
                                          buttons:
                                            - bold
                                            - italic
                                            - unorderedlist
                                            - orderedlist
                                            - quote
                                            - table
                                          type: markdown
                                          display: Body
                                  video_set:
                                    display: 'Video Set'
                                    icon: media-webcam-video
                                    fields:
                                      -
                                        handle: video
                                        field:
                                          type: video
                                          display: Video
                                  image_set:
                                    display: 'Image Set'
                                    icon: media-image-picture-orientation
                                    fields:
                                      -
                                        handle: image
                                        field:
                                          max_files: 1
                                          container: app
                                          type: assets
                                          display: Image
                                  accordion_set:
                                    display: 'Accordion Set'
                                    icon: addon-boxes-stack
                                    fields:
                                      -
                                        handle: accordion
                                        field:
                                          mode: stacked
                                          type: grid
                                          display: Accordion
                                          fields:
                                            -
                                              handle: accordion_box_title
                                              field:
                                                type: text
                                                display: 'Accordion Box Title'
                                            -
                                              handle: accordion_box_content
                                              field:
                                                type: replicator
                                                display: 'Accordion Box Content'
                                                sets:
                                                  new_set_group:
                                                    display: 'New Set Group'
                                                    sets:
                                                      text_set:
                                                        display: 'Text Set'
                                                        icon: text-formatting-image-left
                                                        fields:
                                                          -
                                                            handle: body
                                                            field:
                                                              buttons:
                                                                - bold
                                                                - italic
                                                                - unorderedlist
                                                                - orderedlist
                                                                - quote
                                                                - link
                                                              type: markdown
                                                              display: Body
                                                      video_set:
                                                        display: 'Video Set'
                                                        icon: media-computer-screen-tv
                                                        fields:
                                                          -
                                                            handle: video
                                                            field:
                                                              type: video
                                                              display: Video
                                                      image_set:
                                                        display: 'Image Set'
                                                        icon: media-image-picture-orientation
                                                        fields:
                                                          -
                                                            handle: image
                                                            field:
                                                              max_files: 1
                                                              container: app
                                                              folder: event_types
                                                              type: assets
                                                              display: Image
  v1_api:
    display: 'V1 API'
    sections:
      -
        display: 'V1 API'
        fields:
          -
            handle: card_description
            field:
              type: text
              display: 'Card Description'
          -
            handle: summary
            field:
              type: textarea
              display: Summary
              instructions: 'A brief summary of this event type for the API'
          -
            handle: summary_link
            field:
              type: link
              display: 'Summary Link'
              instructions: 'A related link for the summary'
          -
            handle: new_image
            field:
              max_files: 1
              mode: grid
              container: app
              restrict: true
              type: assets
              display: 'New Image'
              instructions: 'This is the new image for an event type in 2026'
              validate:
                - required
                - image
      -
        display: 'Event Page: Hero'
        instructions: 'The top of every event detail page for this Event Type on wildatheart.org'
        fields:
          -
            handle: page_logo
            field:
              max_files: 1
              container: s3
              type: assets
              display: Logo
              instructions: 'Shown in place of the Event Type name'
          -
            handle: page_background_video_url
            field:
              input_type: url
              type: text
              display: 'Background Video URL'
              instructions: 'A direct link to a video file (e.g. a Vimeo .mp4 link) that plays behind the hero'
          -
            handle: page_background_image
            field:
              max_files: 1
              container: s3
              type: assets
              display: 'Background Image'
              instructions: 'Shown behind the hero while the video loads, or when there is no video'
          -
            handle: page_topics
            field:
              taxonomies:
                - topics
              type: terms
              display: Topics
              instructions: 'Shown as badges under the event details'
      -
        display: 'Event Page: Topic'
        fields:
          -
            handle: page_leader_text
            field:
              type: text
              display: 'Leader Text'
              instructions: 'The small heading above the title lines'
          -
            handle: page_hero_title
            field:
              mode: stacked
              add_row: 'Add Line'
              fields:
                -
                  handle: text
                  field:
                    type: text
                    display: Text
                    validate:
                      - required
                -
                  handle: text_style
                  field:
                    options:
                      solid: 'Hero 1 Solid'
                      hollow: 'Hero 1 Hollow'
                      hollow-italic: 'Hero 1 Hollow Italic'
                      hero2: 'Hero 2'
                      leader: Leader
                      body-large: 'Body Large'
                    default: solid
                    type: select
                    display: 'Text Style'
              type: grid
              display: 'Title Lines'
          -
            handle: page_hero_subtitle
            field:
              type: textarea
              display: Subtitle
          -
            handle: page_featured_video_url
            field:
              type: video
              display: 'Featured Video'
          -
            handle: page_featured_video_fallback_image
            field:
              max_files: 1
              container: s3
              type: assets
              display: 'Featured Video Fallback Image'
      -
        display: 'Event Page: Description'
        fields:
          -
            handle: page_description
            field:
              save_html: true
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - anchor
              type: bard
              display: Description
              instructions: 'The event page body on wildatheart.org, also used as plain text for link previews and cards. The Description on the Main tab is only used by the Local Platform.'
title: 'Event Type'
