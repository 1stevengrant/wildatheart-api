          text: INTRODUCTION
    -
      type: paragraph
      content:
        -
          type: text
          text: 'We at Wild at Heart are providing you a copy of our Event Resource (Wild at Heart BASIC, Captivating CORE, Becoming A King Retreat, Survival School, Wild at Heart Experience, Captivating Experience, and Becoming A King Experience, collectively referred to as the “Event Resource”) subject to the following Terms of Use, as amended from time to time at our sole discretion. The Event Resource may be viewed for your personal and non-commercial use.'
    -
      type: heading
      attrs:
        level: 3
      content:
        -
          type: text
          marks:
            -
              type: bold
          text: 'CONDITIONS OF USE'
    -
      type: paragraph
      content:
        -
          type: text
          text: 'You agree you will not modify the Event Resource in any way. You agree you will not share, disperse, or transfer the Event Resource except for face-to-face education instruction as described in our Facilitator’s Guide, incorporated by reference, and found here:'
    -
      type: paragraph
      content:
        -
          type: text
          marks:
            -
              type: link
              attrs:
                href: 'https://www.dropbox.com/sh/bhip64lc7hemxdq/AACtcwGgdXhztig8ZV3JmBKZa?dl=0'
                rel: null
                target: null
                title: null
          text: 'https://www.dropbox.com/sh/bhip64lc7hemxdq/AACtcwGgdXhztig8ZV3JmBKZa?dl=0'
    -
      type: paragraph
      content:
        -
          type: text
          text: 'To the extent you use the Event Resource for face-to-face educational instruction with others, you agree to first legally obtain a copy of the following movies listed on the Video Cues, incorporated by reference, and found here:'
    -
      type: paragraph
      content:
        -
          type: text
          marks:
            -
              type: link
              attrs:
                href: 'https://www.dropbox.com/sh/bhip64lc7hemxdq/AACtcwGgdXhztig8ZV3JmBKZa?dl=0'
                rel: null
                target: null
                title: null
          text: 'https://www.dropbox.com/sh/bhip64lc7hemxdq/AACtcwGgdXhztig8ZV3JmBKZa?dl=0'
    -
      type: paragraph
      content:
        -
          type: text
          text: 'You agree to immediately comply with any request from Wild at Heart to delete any copies you possess of the Event Resource.'
    -
      type: heading
      attrs:
        level: 3
      content:
        -
          type: text
          marks:
            -
              type: bold
          text: 'INDEMNITY AND RELEASE'
    -
      type: paragraph
      content:
        -
          type: text
          text: "You acknowledge and understand that there are certain dangers and risks to which you may be exposed by utilizing the Event Resource around or near a fire or some other outdoor setting, including the risk of serious physical injury, temporary or permanent disability, and death. The risks may arise not only from your own actions, inactions, or negligence, but also from the actions, inactions, or negligence of others. You also acknowledge and understand that there may be other risks not presently known or reasonably foreseeable.\_"
    -
      type: paragraph
      content:
        -
          type: text
          text: 'You understand that you are not required to use the Event Resource or host a group with or without a fire, but that you freely choose to do so, despite the possible dangers and risks and despite this release, waiver, and assumption of risk. You hereby assume all risks from your participation in any such activities.'
    -
      type: paragraph
      content:
        -
          type: text
          text: "\_You agree, on behalf of your family, heirs, and personal representative(s), to assume all risks and responsibilities surrounding your participation in any activities using the Event Resource. To the maximum extent permitted by law, you release and indemnify Wild at Heart, and its trustees, officers, employees, and agents from and against any and all liability, actions, debts, claims, and demands of every kind whatsoever, specifically including any claim for negligence or negligent acts or omissions and any present or future claim, loss, or liability or injury to person or property that you may suffer, or for which you may be liable to any other person, that may or does arise out of your participation in any activities using the Event Resource."
    -
      type: heading
      attrs:
        level: 3
      content:
        -
          type: text
          marks:
            -
              type: bold
          text: 'COPYRIGHT COMPLAINTS'
    -
      type: paragraph
      content:
        -
          type: text
          text: 'If you believe that your work has been copied in a way that constitutes copyright infringement, notify us of your infringement claim in accordance with the procedure set forth below.'
    -
      type: paragraph
      content:
        -
          type: text
          text: 'You may contact us here:'
    -
