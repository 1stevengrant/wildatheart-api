      content:
        -
          type: text
          marks:
            -
              type: bold
          text: 'Colorado Springs, CO 808949'
        -
          type: text
          text: "\_"
    -
      type: paragraph
      content:
        -
          type: text
          text: 'To be effective, the notification must be in writing and contain the following information: an electronic or physical signature of the person authorized to act on behalf of the owner of the copyright or other intellectual property interest; a description of the copyrighted work or other intellectual property that you claim has been infringed; a description of where the material that you claim is infringing is located in the sessions, with enough detail that we may find it in the sessions; your address, telephone number, and email address; a statement by you that you have a good faith belief that the disputed use is not authorized by the copyright or intellectual property owner, its agent, or the law; a statement by you, made under penalty of perjury, that the above information in your Notice is accurate and that you are the copyright or intellectual property owner or authorized to act on the copyright or intellectual property owner’s behalf.'
