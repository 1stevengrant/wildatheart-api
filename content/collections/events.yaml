title: Events
template: default
layout: layout
revisions: false
route: 'events/{slug}'
date: true
sort_dir: asc
date_behavior:
  past: public
  future: private
preview_targets:
  -
    label: Entry
    url: '{site_url}/events/preview'
    refresh: false
  -
    label: 'Final Details'
    url: '{site_url}/events/{slug}/final-details'
    refresh: false
